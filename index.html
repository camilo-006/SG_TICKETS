<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Tickets</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>SG Tickets - Universidad</h1>
    </header>

    <main class="container">
        <!-- Formulario para crear un nuevo ticket -->
        <section class="ticket-form-section">
            <h2>Crear Nuevo Ticket</h2>
            <form id="ticket-form">
                <div class="form-group">
                    <label for="title">Asunto:</label>
                    <input type="text" id="title" name="title" required placeholder="Ej: Falla en proyector Aula 204">
                </div>
                <div class="form-group">
                    <label for="description">Descripción detallada:</label>
                    <textarea id="description" name="description" rows="4" required placeholder="Describe el problema en detalle..."></textarea>
                </div>
                <div class="form-group">
                    <label for="department">Departamento:</label>
                    <select id="department" name="department" required>
                        <option value="">Seleccione un departamento...</option>
                        <option value="Soporte IT">Soporte IT</option>
                        <option value="Mantenimiento">Mantenimiento General</option>
                        <option value="Administración">Administración</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Registrar Ticket</button>
            </form>
        </section>

        <!-- Listado de tickets -->
        <section class="ticket-list-section">
            <h2>Tickets Activos</h2>
            <div id="ticket-list" class="ticket-list">
                <!-- Los tickets se renderizarán aquí dinámicamente -->
            </div>
        </section>
    </main>

    <!-- Scripts MVC -->
    <script src="js/models/TicketModel.js"></script>
    <script src="js/views/TicketView.js"></script>
    <script src="js/controllers/TicketController.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
